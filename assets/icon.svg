<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Rounded app-icon mask -->
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>

    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#9ccbf6"/>
      <stop offset="1"   stop-color="#84baf0"/>
    </linearGradient>

    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc35c"/>
      <stop offset="1" stop-color="#57ad49"/>
    </linearGradient>

    <!-- Coral body: lit on the left, shaded on the right (light from upper-left) -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0"    stop-color="#f4967f"/>
      <stop offset="0.55" stop-color="#ee8168"/>
      <stop offset="1"    stop-color="#d96f57"/>
    </linearGradient>

    <radialGradient id="eyeShine" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e6ea"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
    <rect x="0" y="300" width="512" height="212" fill="url(#ground)"/>

    <!-- Soft cast shadow to the lower-left -->
    <ellipse cx="196" cy="392" rx="150" ry="34" fill="#3f7a34" opacity="0.55"
             transform="rotate(-6 196 392)"/>

    <!-- Character body -->
    <rect x="196" y="96" width="120" height="300" rx="16" ry="16" fill="url(#body)"/>
    <!-- subtle top highlight -->
    <rect x="196" y="96" width="120" height="26" rx="16" ry="16" fill="#ffffff" opacity="0.10"/>
    <!-- right-edge shade for a bit of depth -->
    <rect x="298" y="96" width="18" height="300" rx="9" ry="9" fill="#000000" opacity="0.07"/>

    <!-- Eyes -->
    <g>
      <!-- left eye -->
      <circle cx="234" cy="176" r="36" fill="url(#eyeShine)" stroke="#c9ccd2" stroke-width="2"/>
      <circle cx="240" cy="184" r="15" fill="#2a2b2e"/>
      <circle cx="234" cy="178" r="5"  fill="#ffffff"/>
      <!-- right eye -->
      <circle cx="300" cy="176" r="36" fill="url(#eyeShine)" stroke="#c9ccd2" stroke-width="2"/>
      <circle cx="306" cy="184" r="15" fill="#2a2b2e"/>
      <circle cx="300" cy="178" r="5"  fill="#ffffff"/>
    </g>
  </g>
</svg>
